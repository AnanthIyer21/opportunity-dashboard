<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Opportunity Radar — Ananth</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎯</text></svg>">
<style>
  :root {
    color-scheme: light;
    --surface-1: #fcfcfb;
    --page: #f9f9f7;
    --text-primary: #0b0b0b;
    --text-secondary: #52514e;
    --muted: #898781;
    --grid: #e1e0d9;
    --baseline: #c3c2b7;
    --border: rgba(11,11,11,0.10);
    --t-internship: #2a78d6;
    --t-hackathon: #eb6834;
    --t-competition: #1baf7a;
    --t-program: #eda100;
    --t-event: #e87ba4;
    --t-job: #008300;
    --t-fellowship: #4a3aa7;
    --s-good: #0ca30c;
    --s-warning: #fab219;
    --s-serious: #ec835a;
    --s-critical: #d03b3b;
    --chip-bg: #f0efec;
    --card-shadow: 0 1px 2px rgba(11,11,11,0.05);
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --surface-1: #1a1a19;
    --page: #0d0d0d;
    --text-primary: #ffffff;
    --text-secondary: #c3c2b7;
    --muted: #898781;
    --grid: #2c2c2a;
    --baseline: #383835;
    --border: rgba(255,255,255,0.10);
    --t-internship: #3987e5;
    --t-hackathon: #d95926;
    --t-competition: #199e70;
    --t-program: #c98500;
    --t-event: #d55181;
    --t-job: #008300;
    --t-fellowship: #9085e9;
    --chip-bg: #262624;
    --card-shadow: none;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --surface-1: #1a1a19;
      --page: #0d0d0d;
      --text-primary: #ffffff;
      --text-secondary: #c3c2b7;
      --muted: #898781;
      --grid: #2c2c2a;
      --baseline: #383835;
      --border: rgba(255,255,255,0.10);
      --t-internship: #3987e5;
      --t-hackathon: #d95926;
      --t-competition: #199e70;
      --t-program: #c98500;
      --t-event: #d55181;
      --t-job: #008300;
      --t-fellowship: #9085e9;
      --chip-bg: #262624;
      --card-shadow: none;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--page);
    color: var(--text-primary);
    font-size: 14px;
    line-height: 1.45;
  }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 24px 20px 80px; }
  header { display: flex; align-items: baseline; justify-content: space-between; flex-wrap: wrap; gap: 8px; margin-bottom: 4px; }
  h1 { font-size: 22px; margin: 0; letter-spacing: -0.2px; }
  .sub { color: var(--text-secondary); font-size: 13px; }
  .theme-btn {
    background: var(--surface-1); border: 1px solid var(--border); color: var(--text-secondary);
    border-radius: 8px; padding: 5px 10px; cursor: pointer; font-size: 13px;
  }
  /* stat tiles */
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin: 18px 0; }
  .tile {
    background: var(--surface-1); border: 1px solid var(--border); border-radius: 10px;
    padding: 12px 14px; box-shadow: var(--card-shadow);
  }
  .tile .v { font-size: 26px; font-weight: 650; }
  .tile .l { font-size: 12px; color: var(--text-secondary); margin-top: 2px; }
  .tile.alert .v { color: var(--s-critical); }
  /* filters */
  .filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 14px 0 6px; }
  .filters input[type="search"] {
    flex: 1 1 220px; min-width: 180px; padding: 8px 12px; border-radius: 8px;
    border: 1px solid var(--baseline); background: var(--surface-1); color: var(--text-primary); font-size: 14px;
  }
  .filters select {
    padding: 8px 10px; border-radius: 8px; border: 1px solid var(--baseline);
    background: var(--surface-1); color: var(--text-primary); font-size: 13px;
  }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0 16px; }
  .chip {
    border: 1px solid var(--baseline); background: var(--surface-1); color: var(--text-secondary);
    border-radius: 999px; padding: 4px 12px; font-size: 12.5px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px;
  }
  .chip .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
  .chip.on { background: var(--text-primary); color: var(--page); border-color: var(--text-primary); }
  .count-line { color: var(--muted); font-size: 12.5px; margin: 0 0 10px; }
  /* cards */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: 12px; }
  .card {
    background: var(--surface-1); border: 1px solid var(--border); border-radius: 12px;
    padding: 14px 16px; box-shadow: var(--card-shadow); display: flex; flex-direction: column; gap: 8px; position: relative;
  }
  .card.done { opacity: 0.55; }
  .row1 { display: flex; align-items: flex-start; gap: 8px; }
  .badge {
    display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; font-weight: 600;
    color: var(--text-secondary); background: var(--chip-bg); border-radius: 6px; padding: 2px 8px; white-space: nowrap;
  }
  .badge .dot { width: 8px; height: 8px; border-radius: 50%; }
  .new-badge { font-size: 11px; font-weight: 700; color: var(--s-good); border: 1px solid var(--s-good); border-radius: 6px; padding: 1px 6px; }
  .card h3 { margin: 0; font-size: 15px; line-height: 1.3; }
  .card h3 a { color: var(--text-primary); text-decoration: none; }
  .card h3 a:hover { text-decoration: underline; }
  .org { color: var(--text-secondary); font-size: 13px; }
  .meta { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12.5px; color: var(--text-secondary); }
  .meta .k { color: var(--muted); }
  .deadline { font-weight: 600; }
  .dl-critical { color: var(--s-critical); }
  .dl-serious { color: var(--s-serious); }
  .dl-warning { color: inherit; }
  .notes { font-size: 12.5px; color: var(--text-secondary); border-top: 1px solid var(--grid); padding-top: 8px; margin-top: auto; }
  .actions { display: flex; gap: 6px; margin-top: 2px; }
  .actions button {
    font-size: 12px; padding: 4px 10px; border-radius: 7px; cursor: pointer;
    border: 1px solid var(--baseline); background: transparent; color: var(--text-secondary);
  }
  .actions button.active { background: var(--text-primary); color: var(--page); border-color: var(--text-primary); }
  .apply-link {
    margin-left: auto; font-size: 12.5px; font-weight: 600; text-decoration: none;
    color: var(--t-internship); padding: 4px 2px;
  }
  .empty { color: var(--muted); padding: 40px 0; text-align: center; }
  .more-wrap { text-align: center; margin: 18px 0 0; }
  .more-wrap button {
    background: var(--surface-1); border: 1px solid var(--baseline); color: var(--text-primary);
    border-radius: 10px; padding: 10px 26px; font-size: 14px; cursor: pointer;
  }
  .more-wrap button:hover { border-color: var(--text-primary); }
  footer { margin-top: 28px; color: var(--muted); font-size: 12px; }
  @media (max-width: 480px) { .grid { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Opportunity Radar</h1>
      <div class="sub" id="updatedLine">Loading…</div>
    </div>
    <button class="theme-btn" id="themeBtn">◐ Theme</button>
  </header>

  <div class="tiles" id="tiles"></div>

  <div class="filters">
    <input type="search" id="q" placeholder="Search title, org, location, notes…">
    <select id="region">
      <option value="">All regions</option>
    </select>
    <select id="sort">
      <option value="deadline">Sort: deadline soonest</option>
      <option value="new">Sort: newest first</option>
      <option value="org">Sort: organisation A–Z</option>
    </select>
    <select id="mine">
      <option value="">Everything</option>
      <option value="saved">★ Saved only</option>
      <option value="applied">✓ Applied only</option>
      <option value="unseen">Hide applied &amp; dismissed</option>
    </select>
  </div>
  <div class="chips" id="typeChips"></div>

  <p class="count-line" id="countLine"></p>
  <div class="grid" id="grid"></div>
  <div class="empty" id="empty" style="display:none">Nothing matches these filters.</div>
  <div class="more-wrap" id="moreWrap" style="display:none"><button id="moreBtn">Load more</button></div>

  <footer>
    Auto-updated every morning at 07:30 by Claude · Deadlines shown in local time · ★/✓ tracking is stored in this browser only.
  </footer>
</div>

<script>
const TYPE_META = {
  internship:  { label: "Internship",  color: "var(--t-internship)" },
  job:         { label: "Job",         color: "var(--t-job)" },
  competition: { label: "Competition", color: "var(--t-competition)" },
  hackathon:   { label: "Hackathon",   color: "var(--t-hackathon)" },
  event:       { label: "Event",       color: "var(--t-event)" },
  program:     { label: "Program",     color: "var(--t-program)" },
  fellowship:  { label: "Fellowship",  color: "var(--t-fellowship)" },
};

let DATA = { updated: "", opportunities: [] };
const PAGE_SIZE = 120;
let state = { q: "", types: new Set(), region: "", sort: "deadline", mine: "", shown: PAGE_SIZE };
let track = {};
try { track = JSON.parse(localStorage.getItem("opp-track") || "{}"); } catch(e) { track = {}; }
function saveTrack() { try { localStorage.setItem("opp-track", JSON.stringify(track)); } catch(e) {} }

// theme toggle
const themeBtn = document.getElementById("themeBtn");
try {
  const t = localStorage.getItem("opp-theme");
  if (t) document.documentElement.dataset.theme = t;
} catch(e) {}
themeBtn.onclick = () => {
  const cur = document.documentElement.dataset.theme ||
    (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  const next = cur === "dark" ? "light" : "dark";
  document.documentElement.dataset.theme = next;
  try { localStorage.setItem("opp-theme", next); } catch(e) {}
};

function daysLeft(deadline) {
  if (!deadline || !/^\d{4}-\d{2}-\d{2}$/.test(deadline)) return null;
  const today = new Date(); today.setHours(0,0,0,0);
  const d = new Date(deadline + "T23:59:59");
  return Math.ceil((d - today) / 86400000);
}

function deadlineHtml(o) {
  const dl = o.deadline;
  if (!dl || dl === "TBA") return '<span class="deadline">Deadline TBA</span>';
  if (dl === "Rolling") return '<span class="deadline">Rolling — apply early</span>';
  const n = daysLeft(dl);
  if (n === null) return '<span class="deadline">' + esc(dl) + '</span>';
  if (n < 0) return '<span class="deadline" style="color:var(--muted)">Closed ' + esc(dl) + '</span>';
  let cls = "", icon = "";
  if (n <= 3) { cls = "dl-critical"; icon = "⛔ "; }
  else if (n <= 7) { cls = "dl-serious"; icon = "⚠️ "; }
  else if (n <= 14) { cls = "dl-warning"; icon = "⏳ "; }
  const when = n === 0 ? "today!" : n === 1 ? "tomorrow" : "in " + n + " days";
  return '<span class="deadline ' + cls + '">' + icon + esc(dl) + ' · closes ' + when + '</span>';
}

function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

function sortKey(o) {
  const n = daysLeft(o.deadline);
  if (n !== null && n >= 0) return n;            // real future deadlines first, soonest first
  if (o.deadline === "Rolling") return 5000;
  if (n !== null && n < 0) return 9000;          // closed last
  return 7000;                                    // TBA near the end
}

function render() {
  const grid = document.getElementById("grid");
  const q = state.q.toLowerCase();
  let list = DATA.opportunities.filter(o => {
    if (state.types.size && !state.types.has(o.type)) return false;
    if (state.region && o.region !== state.region) return false;
    const st = track[o.id] || {};
    if (state.mine === "saved" && !st.saved) return false;
    if (state.mine === "applied" && !st.applied) return false;
    if (state.mine === "unseen" && (st.applied || st.dismissed)) return false;
    if (state.mine !== "unseen" && st.dismissed && state.mine === "") return false;
    if (q) {
      const hay = [o.title, o.org, o.location, o.region, o.notes, o.eligibility, o.category, o.type].join(" ").toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });

  if (state.sort === "deadline") list.sort((a,b) => sortKey(a) - sortKey(b));
  else if (state.sort === "new") list.sort((a,b) => (b.added || "").localeCompare(a.added || ""));
  else list.sort((a,b) => (a.org || "").localeCompare(b.org || ""));

  const visible = list.slice(0, state.shown);
  document.getElementById("countLine").textContent =
    "Showing " + visible.length + " of " + list.length + " matching (" +
    DATA.opportunities.length + " total on the board)";
  document.getElementById("empty").style.display = list.length ? "none" : "block";
  document.getElementById("moreWrap").style.display =
    list.length > state.shown ? "block" : "none";
  document.getElementById("moreBtn").textContent =
    "Load more (" + (list.length - visible.length) + " remaining)";

  grid.innerHTML = visible.map(o => {
    const tm = TYPE_META[o.type] || { label: o.type, color: "var(--muted)" };
    const st = track[o.id] || {};
    const isNew = o.added === DATA.updated;
    return `
    <div class="card${st.applied ? " done" : ""}">
      <div class="row1">
        <span class="badge"><span class="dot" style="background:${tm.color}"></span>${tm.label}</span>
        ${isNew ? '<span class="new-badge">NEW</span>' : ""}
        <span style="margin-left:auto" class="badge">${esc(o.region)}</span>
      </div>
      <h3><a href="${esc(o.url)}" target="_blank" rel="noopener">${esc(o.title)}</a></h3>
      <div class="org">${esc(o.org)} · ${esc(o.location)}</div>
      <div class="meta">
        ${deadlineHtml(o)}
        ${o.dates ? '<span><span class="k">When:</span> ' + esc(o.dates) + "</span>" : ""}
        ${o.pay_or_prize ? '<span><span class="k">💰</span> ' + esc(o.pay_or_prize) + "</span>" : ""}
      </div>
      ${o.notes ? '<div class="notes">' + esc(o.notes) + "</div>" : ""}
      <div class="actions">
        <button data-act="saved" data-id="${esc(o.id)}" class="${st.saved ? "active" : ""}">★ Save</button>
        <button data-act="applied" data-id="${esc(o.id)}" class="${st.applied ? "active" : ""}">✓ Applied</button>
        <button data-act="dismissed" data-id="${esc(o.id)}" class="${st.dismissed ? "active" : ""}">✕ Hide</button>
        <a class="apply-link" href="${esc(o.url)}" target="_blank" rel="noopener">Open ↗</a>
      </div>
    </div>`;
  }).join("");

  grid.querySelectorAll("button[data-act]").forEach(b => {
    b.onclick = () => {
      const id = b.dataset.id, act = b.dataset.act;
      track[id] = track[id] || {};
      track[id][act] = !track[id][act];
      saveTrack(); render(); renderTiles();
    };
  });
}

function renderTiles() {
  const opps = DATA.opportunities;
  const open = opps.filter(o => { const n = daysLeft(o.deadline); return n === null || n >= 0; });
  const closing = opps.filter(o => { const n = daysLeft(o.deadline); return n !== null && n >= 0 && n <= 14; });
  const fresh = opps.filter(o => o.added === DATA.updated);
  const saved = opps.filter(o => (track[o.id] || {}).saved && !(track[o.id] || {}).applied);
  const applied = opps.filter(o => (track[o.id] || {}).applied);
  document.getElementById("tiles").innerHTML = `
    <div class="tile"><div class="v">${open.length}</div><div class="l">Open opportunities</div></div>
    <div class="tile${closing.length ? " alert" : ""}"><div class="v">${closing.length}</div><div class="l">Closing within 14 days</div></div>
    <div class="tile"><div class="v">${fresh.length}</div><div class="l">Added in latest update</div></div>
    <div class="tile"><div class="v">${saved.length}</div><div class="l">★ Saved, not yet applied</div></div>
    <div class="tile"><div class="v">${applied.length}</div><div class="l">✓ Applications sent</div></div>`;
}

function renderChips() {
  const counts = {};
  DATA.opportunities.forEach(o => counts[o.type] = (counts[o.type] || 0) + 1);
  const el = document.getElementById("typeChips");
  el.innerHTML = Object.keys(TYPE_META).filter(t => counts[t]).map(t => {
    const tm = TYPE_META[t];
    return `<button class="chip${state.types.has(t) ? " on" : ""}" data-type="${t}">
      <span class="dot" style="background:${tm.color}"></span>${tm.label} · ${counts[t]}</button>`;
  }).join("");
  el.querySelectorAll(".chip").forEach(c => {
    c.onclick = () => {
      const t = c.dataset.type;
      state.types.has(t) ? state.types.delete(t) : state.types.add(t);
      state.shown = PAGE_SIZE;
      renderChips(); render();
    };
  });
}

function renderRegions() {
  const regions = [...new Set(DATA.opportunities.map(o => o.region))].sort();
  const sel = document.getElementById("region");
  sel.innerHTML = '<option value="">All regions</option>' +
    regions.map(r => `<option>${esc(r)}</option>`).join("");
}

document.getElementById("q").addEventListener("input", e => { state.q = e.target.value; state.shown = PAGE_SIZE; render(); });
document.getElementById("region").addEventListener("change", e => { state.region = e.target.value; state.shown = PAGE_SIZE; render(); });
document.getElementById("sort").addEventListener("change", e => { state.sort = e.target.value; state.shown = PAGE_SIZE; render(); });
document.getElementById("mine").addEventListener("change", e => { state.mine = e.target.value; state.shown = PAGE_SIZE; render(); });
document.getElementById("moreBtn").addEventListener("click", () => { state.shown += PAGE_SIZE * 2; render(); });

fetch("opportunities.json?v=" + Date.now())
  .then(r => r.json())
  .then(d => {
    DATA = d;
    document.getElementById("updatedLine").textContent =
      "Jobs · internships · competitions · hackathons · events — last updated " + d.updated;
    renderTiles(); renderChips(); renderRegions(); render();
  })
  .catch(() => {
    document.getElementById("updatedLine").textContent = "Could not load opportunities.json";
  });
</script>
</body>
</html>
